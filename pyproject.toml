[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-ai"
version = "0.1.0"
description = "Text-conditioned online handwriting generation for plotter trajectories."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "torch",
  "matplotlib",
  "pillow",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

