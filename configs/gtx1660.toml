[run]
name = "gtx1660"
seed = 42
out_dir = "runs/gtx1660"

[hardware]
device = "auto"
num_workers = 2
pin_memory = true
amp = true
persistent_workers = true
prefetch_factor = 2
torch_compile = false
matmul_precision = "high"

[data]
dataset_npz = "dataset/all_trajectories.npz"
val_fraction = 0.10
split_seed = 42
resample_spacing = 1.25
smooth_window = 3
max_points = 4096
max_text_len = 96
batch_size = 2
augment = true
jitter_std = 0.015
scale_jitter = 0.04

[autoencoder]
hidden_dim = 128
latent_dim = 64
downsample_factor = 4
bottleneck_layers = 4
dropout = 0.10
local_kernel_size = 9
learning_rate = 0.0003
weight_decay = 0.00001
epochs = 120
grad_accum_steps = 8
max_grad_norm = 1.0
kl_weight = 0.0
pen_weight = 0.35
curvature_weight = 0.05
render_weight = 0.0
content_loss_weight = 0.5
content_loss_every = 1
checkpoint_every = 40
eval_every = 5

[generator]
hidden_dim = 192
text_dim = 192
layers = 6
n_heads = 6
dropout = 0.10
learning_rate = 0.0002
weight_decay = 0.00001
epochs = 180
grad_accum_steps = 8
max_grad_norm = 1.0
augment_targets = false
duration_loss_weight = 0.20
endpoint_latent_weight = 0.25
decoded_xy_weight = 2.0
decoded_path_weight = 0.40
decoded_pen_weight = 0.30
decoded_pen_pos_weight = 8.0
decoded_curvature_weight = 0.05
semantic_weight = 0.05
semantic_every = 4
eval_samples = 12
eval_flow_steps = 16
checkpoint_every = 40
flow_steps = 32
temperature = 1.0
eval_every = 5

[recognizer]
hidden_dim = 160
layers = 2
dropout = 0.10
learning_rate = 0.0004
weight_decay = 0.00001
epochs = 80
grad_accum_steps = 4
max_grad_norm = 1.0
checkpoint_every = 5
eval_every = 5
